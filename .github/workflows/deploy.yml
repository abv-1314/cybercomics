# Каждый push в main: собрать сайт и выложить его на хостинг по SSH (rsync).
# Секреты репозитория (Settings → Secrets and variables → Actions → Secrets):
#   SSH_HOST     — адрес сервера хостинга (например, server123.hosting.reg.ru)
#   SSH_USER     — логин хостинга (u1234567)
#   SSH_PASSWORD — пароль от хостинга
# Переменные (там же, вкладка Variables), все необязательные:
#   DEPLOY_PATH          — папка сайта на хостинге, по умолчанию www/cybercomics.ru
#   METRIKA_ID           — номер счётчика Яндекс.Метрики (включать только после уведомления в РКН)
#   YANDEX_VERIFICATION  — код подтверждения Яндекс Вебмастера
#   GOOGLE_VERIFICATION  — код подтверждения Google Search Console
name: Сборка и выкладка

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Установить Playwright
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium

      # Даты в sitemap.xml берутся из дат файлов: вернём им даты последних коммитов.
      - name: Даты файлов из git
        run: |
          git ls-files -z | while IFS= read -r -d '' f; do
            touch -d "$(git log -1 --format=%cI -- "$f")" "$f"
          done

      - name: Собрать сайт
        env:
          SITE_URL: https://cybercomics.ru
          CONTACT_EMAIL: cybercomics@yandex.ru
          METRIKA_ID: ${{ vars.METRIKA_ID }}
          YANDEX_VERIFICATION: ${{ vars.YANDEX_VERIFICATION }}
          GOOGLE_VERIFICATION: ${{ vars.GOOGLE_VERIFICATION }}
        run: |
          node src/build.js
          node src/prerender.js
          cp deploy/htaccess.txt dist/.htaccess
          test -s dist/index.html && test -s dist/sitemap.xml && test -s dist/404.html
          echo "Страниц: $(find dist -name index.html | wc -l)"

      - name: Выложить на хостинг
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSHPASS: ${{ secrets.SSH_PASSWORD }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH || 'www/cybercomics.ru' }}
        run: |
          if [ -z "$SSH_HOST" ] && [ -z "$SSH_USER" ] && [ -z "$SSHPASS" ]; then
            echo "::warning::Секреты хостинга ещё не заданы: сайт собран, но не выложен"; exit 0
          fi
          if [ -z "$SSH_HOST" ] || [ -z "$SSH_USER" ] || [ -z "$SSHPASS" ]; then
            echo "::error::Задайте все три секрета: SSH_HOST, SSH_USER, SSH_PASSWORD"; exit 1
          fi
          # Защита: --delete стирает лишнее только внутри папки сайта.
          case "$DEPLOY_PATH" in
            *..*|/|"") echo "::error::Странный DEPLOY_PATH: $DEPLOY_PATH"; exit 1 ;;
            *cybercomics.ru*) ;;
            *) echo "::error::DEPLOY_PATH должен вести в папку cybercomics.ru"; exit 1 ;;
          esac
          sudo apt-get install -y -qq sshpass rsync >/dev/null
          # Файлы подтверждения Вебмастера/Search Console и .well-known не трогаем.
          rsync -az --delete --checksum \
            --exclude 'yandex_*.html' --exclude 'google*.html' --exclude '.well-known/' --exclude 'cgi-bin/' \
            -e "sshpass -e ssh -o StrictHostKeyChecking=accept-new" \
            dist/ "$SSH_USER@$SSH_HOST:$DEPLOY_PATH/"
          echo "Готово: https://cybercomics.ru"
