# Каждый push в main: собрать сайт и положить готовые файлы в ветку `site`.
# Хостинг reg.ru раз в 5 минут проверяет ветку и обновляет сайт сам (deploy/pull.sh, крон).
# Переменные (Settings → Secrets and variables → Actions → Variables), все необязательные:
#   METRIKA_ID           — номер счётчика Яндекс.Метрики (включать только после уведомления в РКН)
#   YANDEX_VERIFICATION  — код подтверждения Яндекс Вебмастера
#   GOOGLE_VERIFICATION  — код подтверждения Google Search Console
name: Сборка и выкладка

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-24.04  # Playwright 1.56 не поддерживает Ubuntu 26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Установить Playwright
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium

      # Даты в sitemap.xml берутся из дат файлов: вернём им даты последних коммитов.
      - name: Даты файлов из git
        run: |
          git ls-files -z | while IFS= read -r -d '' f; do
            touch -d "$(git log -1 --format=%cI -- "$f")" "$f"
          done

      - name: Собрать сайт
        env:
          SITE_URL: https://cybercomics.ru
          CONTACT_EMAIL: cybercomics@yandex.ru
          METRIKA_ID: ${{ vars.METRIKA_ID }}
          YANDEX_VERIFICATION: ${{ vars.YANDEX_VERIFICATION }}
          GOOGLE_VERIFICATION: ${{ vars.GOOGLE_VERIFICATION }}
        run: |
          node src/build.js
          node src/prerender.js
          cp deploy/htaccess.txt dist/.htaccess
          test -s dist/index.html && test -s dist/sitemap.xml && test -s dist/404.html
          echo "Страниц: $(find dist -name index.html | wc -l)"

      # Готовый сайт кладём в ветку `site`. Хостинг сам забирает её по крону (deploy/pull.sh):
      # reg.ru не пускает SSH-подключения с серверов GitHub.
      - name: Опубликовать сборку в ветку site
        run: |
          cd dist
          echo "${GITHUB_SHA}" > VERSION
          git init -q -b site
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Сборка ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" site
          echo "Сборка ${GITHUB_SHA::7} в ветке site. Хостинг заберёт её в течение 5 минут."
