<script type="text/x-dc" data-dc-script data-props='{"kind":{"editor":"enum","options":["v1","v2","v3","v4","v5","v6","v7","v8","v9","poster"],"default":"v2"},"vname":{"editor":"text","default":"Лагоед"},"emblem":{"editor":"text","default":"✂"},"color":{"editor":"text","default":"#19c3ff"},"preview":{"editor":"boolean","default":false},"fit":{"editor":"enum","options":["cover","square"],"default":"cover"},"$preview":{"width":300,"height":375}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { play: false }; }
  componentWillUnmount() { if (this._t) clearTimeout(this._t); }
  renderVals() {
    const k = this.props.kind ?? 'v2';
    const BG = { v1: '#20a9fa', v2: '#f10c15', v3: '#fd4f8f', v4: '#7b4dff', v5: '#fe7506', v6: '#08c447', v7: '#18a5fc', v8: '#b3f23d', v9: '#fcd004' };
    const play = !!(this.state && this.state.play) || !!this.props.preview;
    const o = {
      rootCls: 'va' + (play ? ' play' : ''),
      rootStyle: '--bg: ' + (k === 'poster' ? (this.props.color || '#ffd60a') : (BG[k] || 'transparent')) + '; --oy: ' + (this.props.fit === 'square' ? ({ v7: '38%', v8: '12%' }[k] || '0%') : '0%'),
      ghost: k === 'v4',
      // Постер без портрета (выпуски Фундамента): имя злодея, эмблема, растр и цвет выпуска.
      poster: k === 'poster',
      pst: (() => {
        const name = String(this.props.vname || '');
        const em = String(this.props.emblem || (name ? name[0] : '?'));
        const words = name.split(/\s+/).filter(Boolean);
        const L = Math.max(4, ...words.map((w) => w.length));
        const E = Math.max(1, Array.from(em).length);
        return {
          name, emblem: em,
          // Имя помещается по ширине самого длинного слова и по высоте (каждое слово — своя строка).
          nameStyle: 'font-size:min(' + Math.min(13, 86 / (L * 0.95)).toFixed(2) + 'cqw,' + (26 / Math.max(1, words.length)).toFixed(2) + 'cqh)',
          emStyle: 'font-size:' + Math.min(26, 38 / (E * 0.82)).toFixed(2) + 'cqmin'
        };
      })(),
      // Мышь: сценка играет, пока курсор на персонаже. Палец: касание или свайп по персонажу запускает её, через 3 с она сбрасывается.
      start: (e) => {
        const touch = !e || e.type === 'touchmove' || (e.pointerType && e.pointerType !== 'mouse');
        if (touch && this.state && this.state.play) return;
        if (this._t) clearTimeout(this._t);
        if (touch) this._t = setTimeout(() => this.setState({ play: false }), 3000);
        if (!(this.state && this.state.play)) this.setState({ play: true });
      },
      stop: (e) => {
        if (e && e.pointerType && e.pointerType !== 'mouse') return;
        if (this._t) clearTimeout(this._t);
        this.setState({ play: false });
      }
    };
    ['v1','v2','v3','v5','v6','v7','v8','v9'].forEach((x) => { o[x] = k === x; });
    return o;
  }
}
</script>
