# CyberComics — nginx для статического сайта (папка dist/ после сборки).
# Положить в /etc/nginx/sites-available/cybercomics.conf, включить ссылкой в sites-enabled, проверить: nginx -t && systemctl reload nginx.
# Сертификат: certbot --nginx -d cybercomics.ru -d www.cybercomics.ru (Let's Encrypt) — пути ниже его стандартные.
# Сборка: SITE_URL=https://cybercomics.ru CONTACT_EMAIL=… node src/build.js && node src/prerender.js
# Выкладка: rsync -a --delete dist/ user@server:/var/www/cybercomics/   (root ниже указывает туда)

# Кеш для CSS/JS: адрес с ?v=<хеш> (его ставит src/build.js) — на год; без версии — на час.
map $arg_v $cc_asset_cache {
    ""      "public, max-age=3600";
    default "public, max-age=31536000, immutable";
}

# 1) http://cybercomics.ru и http://www… → https://cybercomics.ru (одним 301, без цепочек)
server {
    listen 80;
    listen [::]:80;
    server_name cybercomics.ru www.cybercomics.ru;
    # для продления сертификата certbot (webroot); с плагином --nginx не мешает
    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://cybercomics.ru$request_uri; }
}

# 2) https://www.cybercomics.ru → https://cybercomics.ru
server {
    listen 443 ssl http2;           # nginx ≥ 1.25.1 предупредит «http2 is deprecated» — можно заменить на «http2 on;»
    listen [::]:443 ssl http2;
    server_name www.cybercomics.ru;
    ssl_certificate     /etc/letsencrypt/live/cybercomics.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cybercomics.ru/privkey.pem;
    return 301 https://cybercomics.ru$request_uri;
}

# 3) Основной сайт
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name cybercomics.ru;

    ssl_certificate     /etc/letsencrypt/live/cybercomics.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cybercomics.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    root /var/www/cybercomics;
    index index.html;
    charset utf-8;
    server_tokens off;
    absolute_redirect off;          # /vypuski/idor → /vypuski/idor/ относительным 301, без http:// и порта

    # Важно: add_header внутри location отменяет add_header уровня server, поэтому заголовки
    # безопасности повторены в location / (страницы). HSTS включить, когда https проверен везде:
    #   add_header Strict-Transport-Security "max-age=31536000" always;   (в location /)

    # Сжатие. Картинки (webp, png, jpg) и woff2 уже сжаты — их не трогаем.
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/css application/javascript text/javascript application/json application/manifest+json
               image/svg+xml application/xml text/xml text/plain image/x-icon;

    # Типы файлов берутся из /etc/nginx/mime.types (webp и woff2 там есть с nginx 1.21). Манифеста там нет:
    location = /assets/site.webmanifest { default_type application/manifest+json; add_header Cache-Control "public, max-age=604800" always; }

    # Страница 404 из сборки (пути в ней от корня, работает на любом адресе)
    error_page 404 /404.html;
    location = /404.html { internal; add_header Cache-Control "no-cache" always; }

    # Старый адрес магазина → Барахолка (настоящий 301 вместо страницы-переезда)
    location ~ ^/lavka(/.*)?$ { return 301 /baraholka/; }

    # Страницы: всегда проверять свежесть (ETag/Last-Modified), чтобы новый выпуск был виден сразу.
    # try_files здесь нарочно нет: тогда nginx сам отвечает 301 с /vypuski/idor на /vypuski/idor/
    # (у страниц относительные пути ../../assets), отдаёт index.html папки и 404.html для несуществующего.
    location / {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
    }

    # CSS и JS: с ?v=… — на год, без версии (legal.js) — на час
    location ~* ^/assets/.+\.(css|js)$ {
        add_header Cache-Control $cc_asset_cache always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Шрифты и портреты: имена не меняются при правках, поэтому 30 дней (не immutable)
    location ~* ^/assets/(fonts|img)/ {
        add_header Cache-Control "public, max-age=2592000" always;
        add_header Access-Control-Allow-Origin "*" always;   # preload шрифтов идёт с crossorigin
    }

    # Картинки для соцсетей и иконки: сутки / неделя
    location ^~ /assets/og/ { add_header Cache-Control "public, max-age=86400" always; }
    location ~* ^/(favicon\.ico|apple-touch-icon\.png|assets/(favicon\.svg|[^/]+\.png))$ {
        add_header Cache-Control "public, max-age=604800" always;
    }

    # Служебные файлы для роботов: коротко
    location ~* ^/(robots\.txt|sitemap\.xml|llms\.txt)$ { add_header Cache-Control "public, max-age=3600" always; }

    # Скрытые файлы (.git, .env и т. п.) не отдавать
    location ~ /\.(?!well-known/) { deny all; return 404; }
}
